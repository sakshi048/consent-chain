services:
  validator1:
    image: hyperledger/besu:24.12.2
    container_name: consent-chain-validator1
    command: ["--data-path=/data", "--genesis-file=/network/genesis.json", "--node-private-key-file=/network/validator-1.key", "--network-id=1337", "--p2p-host=0.0.0.0", "--p2p-port=30303", "--discovery-enabled=false", "--static-nodes-file=/network/validator-1-static-nodes.json", "--rpc-http-enabled=true", "--rpc-http-host=0.0.0.0", "--rpc-http-port=8545", "--rpc-http-api=ETH,NET,WEB3,QBFT", "--host-allowlist=*", "--rpc-http-cors-origins=all"]
    volumes:
      - ./network:/network:ro
      - validator1-data:/data
    ports:
      - "8545:8545"
    networks: [consent-chain]
    restart: unless-stopped
  validator2:
    image: hyperledger/besu:24.12.2
    container_name: consent-chain-validator2
    command: ["--data-path=/data", "--genesis-file=/network/genesis.json", "--node-private-key-file=/network/validator-2.key", "--network-id=1337", "--p2p-host=0.0.0.0", "--p2p-port=30303", "--discovery-enabled=false", "--static-nodes-file=/network/validator-2-static-nodes.json", "--rpc-http-enabled=true", "--rpc-http-host=0.0.0.0", "--rpc-http-port=8545", "--rpc-http-api=ETH,NET,WEB3,QBFT", "--host-allowlist=*", "--rpc-http-cors-origins=all"]
    volumes:
      - ./network:/network:ro
      - validator2-data:/data
    networks: [consent-chain]
    restart: unless-stopped
  validator3:
    image: hyperledger/besu:24.12.2
    container_name: consent-chain-validator3
    command: ["--data-path=/data", "--genesis-file=/network/genesis.json", "--node-private-key-file=/network/validator-3.key", "--network-id=1337", "--p2p-host=0.0.0.0", "--p2p-port=30303", "--discovery-enabled=false", "--static-nodes-file=/network/validator-3-static-nodes.json", "--rpc-http-enabled=true", "--rpc-http-host=0.0.0.0", "--rpc-http-port=8545", "--rpc-http-api=ETH,NET,WEB3,QBFT", "--host-allowlist=*", "--rpc-http-cors-origins=all"]
    volumes:
      - ./network:/network:ro
      - validator3-data:/data
    networks: [consent-chain]
    restart: unless-stopped
  validator4:
    image: hyperledger/besu:24.12.2
    container_name: consent-chain-validator4
    command: ["--data-path=/data", "--genesis-file=/network/genesis.json", "--node-private-key-file=/network/validator-4.key", "--network-id=1337", "--p2p-host=0.0.0.0", "--p2p-port=30303", "--discovery-enabled=false", "--static-nodes-file=/network/validator-4-static-nodes.json", "--rpc-http-enabled=true", "--rpc-http-host=0.0.0.0", "--rpc-http-port=8545", "--rpc-http-api=ETH,NET,WEB3,QBFT", "--host-allowlist=*", "--rpc-http-cors-origins=all"]
    volumes:
      - ./network:/network:ro
      - validator4-data:/data
    networks: [consent-chain]
    restart: unless-stopped

networks:
  consent-chain:
    driver: bridge
volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:

